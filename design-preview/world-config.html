<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>荒野中枢 · 世界配置预览</title>
  <style>
    :root {
      color-scheme: light;
      --canvas:#f6f6f7; --sidebar:#efeff1; --surface:#fff; --surface-muted:#f1f1f3;
      --surface-hover:#e8e8eb; --text:#202124; --text-secondary:#676a70; --text-tertiary:#85878d;
      --border:#dfe0e3; --border-strong:#c9cbd1; --accent:#5b63d3; --accent-soft:#e9eafd;
      --success:#237a50; --warning:#99620a; --on-accent:#fff;
      --shadow:0 16px 40px rgba(26,28,35,.15);
      --radius-control:6px; --radius-panel:8px;
    }
    :root[data-theme="dark"] {
      color-scheme:dark; --canvas:#151619; --sidebar:#191a1d; --surface:#1e1f22; --surface-muted:#25262a;
      --surface-hover:#2b2c31; --text:#f2f2f3; --text-secondary:#a5a7ad; --text-tertiary:#858890;
      --border:#303238; --border-strong:#44464e; --accent:#8d93ee; --accent-soft:#2a2c50;
      --success:#61c992; --warning:#e1a346; --on-accent:#191a1d;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-width:960px; min-height:680px; height:100%; }
    body { font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--text); background:var(--canvas); font-size:14px; line-height:1.5; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { border:0; background:transparent; cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .app-shell { display:grid; grid-template-columns:236px minmax(0,1fr); height:100vh; min-height:680px; }
    .sidebar { display:flex; flex-direction:column; gap:24px; padding:16px 12px 12px; background:var(--sidebar); border-right:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:12px; padding:0 8px; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:6px; background:var(--text); color:var(--surface); font-weight:700; letter-spacing:-.04em; }
    .brand strong,.brand small { display:block; } .brand strong { font-size:16px; } .brand small { color:var(--text-secondary); font-size:12px; }
    .server-switcher { display:grid; grid-template-columns:32px minmax(0,1fr) 16px; align-items:center; gap:8px; width:100%; padding:8px; text-align:left; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
    .server-icon { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--border); border-radius:6px; color:var(--accent); font-size:16px; }
    .server-text strong,.server-text small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .server-text strong { font-size:13px; } .server-text small { color:var(--text-secondary); font-size:12px; }
    .chevron { color:var(--text-secondary); font-size:12px; }
    .nav { display:grid; gap:24px; } .nav-group { display:grid; gap:4px; } .nav-label { padding:0 12px 4px; color:var(--text-tertiary); font-size:12px; }
    .nav-item { display:flex; align-items:center; gap:12px; width:100%; min-height:36px; padding:8px 12px; color:var(--text-secondary); border-radius:6px; text-align:left; }
    .nav-item:hover,.nav-item.active { color:var(--text); background:var(--surface-hover); } .nav-item.active { font-weight:600; }
    .sidebar-spacer { flex:1; } .sidebar-footer { padding:12px; border-top:1px solid var(--border); color:var(--text-tertiary); font-size:12px; display:flex; justify-content:space-between; }
    .main { display:grid; grid-template-rows:56px minmax(0,1fr) 60px; min-width:0; min-height:0; background:var(--surface); }
    .topbar { display:flex; align-items:center; gap:8px; padding:0 24px; border-bottom:1px solid var(--border); color:var(--text-secondary); font-size:13px; }
    .topbar .current { color:var(--text); } .topbar .slash { color:var(--text-tertiary); } .top-actions { margin-left:auto; display:flex; gap:4px; }
    .icon-button { width:32px; height:32px; display:grid; place-items:center; border-radius:6px; color:var(--text-secondary); } .icon-button:hover { background:var(--surface-hover); color:var(--text); }
    .scroll { overflow:auto; min-height:0; } .page { width:min(1120px,100%); margin:0 auto; padding:24px; }
    .page-header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:20px; }
    .eyebrow { margin-bottom:4px; color:var(--text-tertiary); font-size:12px; } h1,h2,p { margin:0; } h1 { font-size:20px; line-height:1.25; font-weight:600; } h2 { font-size:16px; font-weight:600; }
    .header-actions { display:flex; align-items:center; gap:8px; } .button { min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 12px; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); font-size:13px; white-space:nowrap; }
    .button:hover { background:var(--surface-hover); } .button.primary { border-color:var(--accent); background:var(--accent); color:var(--on-accent); } .button.primary:hover { filter:brightness(.96); }
    .status { display:inline-flex; align-items:center; gap:8px; color:var(--warning); font-size:13px; } .status-dot { width:7px; height:7px; border-radius:50%; background:var(--warning); }
    .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:24px; overflow:auto; } .tab { padding:10px 12px; color:var(--text-secondary); border-bottom:2px solid transparent; white-space:nowrap; font-size:13px; } .tab:hover { color:var(--text); } .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .section { margin-bottom:28px; } .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--border); } .section-head p { color:var(--text-secondary); font-size:12px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px 24px; padding-top:18px; } .field { display:flex; flex-direction:column; gap:7px; min-width:0; } .field.full { grid-column:1/-1; }
    .field-label { color:var(--text); font-size:13px; } .field-meta { color:var(--text-tertiary); font-size:12px; font-weight:400; margin-left:4px; }
    input,select,textarea { width:100%; border:1px solid var(--border-strong); border-radius:6px; background:var(--surface); } input,select { min-height:38px; padding:0 11px; } textarea { min-height:82px; padding:9px 11px; resize:vertical; line-height:1.55; overflow-wrap:anywhere; word-break:break-word; white-space:pre-wrap; }
    input::placeholder,textarea::placeholder { color:var(--text-tertiary); } select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%); background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
    .secret-fields { display:grid; grid-template-columns:1fr 1fr; gap:20px 24px; margin-top:18px; } .secret-field { min-width:0; }
    .switch-list { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; margin-top:8px; } .switch-row { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:58px; padding:12px 0; border-bottom:1px solid var(--border); } .switch-row strong,.switch-row small { display:block; } .switch-row small { margin-top:2px; color:var(--text-secondary); font-size:12px; }
    .switch { position:relative; flex:0 0 auto; width:38px; height:22px; } .switch input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; } .track { position:absolute; inset:0; border:1px solid var(--border-strong); border-radius:999px; background:var(--surface-muted); transition:background 120ms ease,border-color 120ms ease; pointer-events:none; } .thumb { position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--text-tertiary); transition:transform 120ms ease,background 120ms ease; pointer-events:none; } .switch input:checked + .track { border-color:var(--accent); background:var(--accent); } .switch input:checked + .track + .thumb { transform:translateX(16px); background:var(--on-accent); }
    .shard-list { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-top:18px; } .shard { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:52px; padding:0 14px; border:1px solid var(--border); border-radius:6px; } .shard strong { font-size:13px; } .shard span { color:var(--success); font-size:12px; } .shard.disabled span { color:var(--text-tertiary); }
    .actionbar { display:flex; align-items:center; gap:16px; padding:12px 24px; border-top:1px solid var(--border); background:var(--surface); } .action-message { color:var(--text-secondary); font-size:12px; } .actionbar .button { margin-left:auto; }
    .toast { position:fixed; right:24px; bottom:78px; padding:10px 14px; border:1px solid var(--border); border-radius:6px; background:var(--surface); box-shadow:var(--shadow); color:var(--text); font-size:13px; opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity 150ms ease,transform 150ms ease; } .toast.show { opacity:1; transform:translateY(0); }
    @media (max-width:1100px) { .form-grid,.secret-fields,.switch-list { grid-template-columns:1fr; } .field.full { grid-column:auto; } }
    @media (max-width:800px) { html,body { min-width:0; } .app-shell { grid-template-columns:68px minmax(0,1fr); } .sidebar { padding:16px 8px 12px; } .brand { justify-content:center; padding:0; } .brand > div:not(.brand-mark),.server-text,.chevron,.server-switcher,.nav-label,.sidebar-footer { display:none; } .server-switcher { display:grid; grid-template-columns:1fr; padding:8px; } .server-icon { margin:auto; } .nav-item { justify-content:center; padding:8px; } .nav-item span { display:none; } .page { padding:20px 16px; } .topbar { padding:0 16px; } .actionbar { padding:12px 16px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">荒</div><div><strong>荒野中枢</strong><small>hunger-desolate</small></div></div>
      <button class="server-switcher" type="button"><span class="server-icon">⌂</span><span class="server-text"><strong>上海服务器</strong><small>已连接 · 2 个专服</small></span><span class="chevron">⌄</span></button>
      <nav class="nav" aria-label="主导航">
        <div class="nav-group"><div class="nav-label">专服</div><button class="nav-item" type="button"><span>▦</span><span>专服列表</span></button><button class="nav-item" type="button"><span>◌</span><span>专服概览</span></button><button class="nav-item active" type="button"><span>◒</span><span>世界</span></button><button class="nav-item" type="button"><span>◇</span><span>MOD</span></button><button class="nav-item" type="button"><span>□</span><span>备份</span></button><button class="nav-item" type="button"><span>↗</span><span>更新</span></button><button class="nav-item" type="button"><span>≡</span><span>诊断</span></button></div>
        <div class="nav-group"><div class="nav-label">主机</div><button class="nav-item" type="button"><span>⌁</span><span>主机环境</span></button><button class="nav-item" type="button"><span>⚙</span><span>连接设置</span></button></div>
      </nav>
      <div class="sidebar-spacer"></div><div class="sidebar-footer"><span>应用设置</span><span>v0.1.0</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><span>上海服务器</span><span class="slash">/</span><span>生存一服</span><span class="slash">/</span><span class="current">世界</span><div class="top-actions"><button class="icon-button" id="themeToggle" type="button" aria-label="切换主题">☼</button><button class="icon-button" type="button" aria-label="更多操作">⋯</button></div></header>
      <div class="scroll"><div class="page">
        <div class="page-header"><div><div class="eyebrow">生存一服</div><h1>世界配置</h1></div><div class="header-actions"><span class="status"><span class="status-dot"></span>待应用</span><button class="button" id="refreshBtn" type="button">↻&nbsp; 刷新</button></div></div>
        <nav class="tabs" aria-label="世界配置分类"><button class="tab active" type="button" data-tab="basic">基本设置</button><button class="tab" type="button" data-tab="access">访问与联机</button><button class="tab" type="button" data-tab="generation">世界生成</button><button class="tab" type="button" data-tab="rules">世界规则</button></nav>
        <section class="tab-panel" data-panel="basic">
          <section class="section"><div class="section-head"><h2>基础信息</h2><p>配置版本 <span class="mono">42</span></p></div><div class="form-grid">
            <label class="field"><span class="field-label">世界名称</span><input value="永恒之森" maxlength="64" /></label>
            <label class="field"><span class="field-label">游戏模式</span><select><option>生存</option><option>无尽</option><option>荒野</option><option>轻松</option></select></label>
            <label class="field"><span class="field-label">最大玩家数</span><input type="number" value="6" min="1" max="128" /></label>
            <label class="field"><span class="field-label">语言</span><select><option>简体中文</option><option>English</option></select></label>
            <label class="field full"><span class="field-label">世界描述 <span class="field-meta">可选</span></span><textarea placeholder="输入一段简短描述">和朋友一起探索、建造与生存。</textarea></label>
          </div></section>
          <section class="section"><div class="section-head"><h2>联机凭据</h2><p>敏感内容不会回显</p></div><div class="secret-fields">
            <label class="field secret-field"><span class="field-label">服务器密码 <span class="field-meta">留空保持当前密码</span></span><input type="password" placeholder="输入新密码" autocomplete="new-password" /></label>
            <label class="field secret-field"><span class="field-label">Klei Token <span class="field-meta">留空保持当前 Token</span></span><textarea rows="3" placeholder="粘贴 Klei Token，可换行输入" autocomplete="off"></textarea></label>
          </div></section>
          <section class="section"><div class="section-head"><h2>世界选项</h2><p>保存后可预览应用影响</p></div><div class="switch-list">
            <div class="switch-row"><div><strong>允许 PVP</strong><small>玩家之间可以互相造成伤害</small></div><label class="switch"><input type="checkbox" checked /><span class="track"></span><span class="thumb"></span></label></div>
            <div class="switch-row"><div><strong>无人时暂停</strong><small>没有玩家在线时暂停世界时间</small></div><label class="switch"><input type="checkbox" checked /><span class="track"></span><span class="thumb"></span></label></div>
            <div class="switch-row"><div><strong>启用踢人投票</strong><small>允许玩家发起踢人投票</small></div><label class="switch"><input type="checkbox" /><span class="track"></span><span class="thumb"></span></label></div>
          </div></section>
          <section class="section"><div class="section-head"><h2>世界分片</h2><p>由实例创建时确定</p></div><div class="shard-list"><div class="shard"><strong>Master</strong><span>已启用</span></div><div class="shard"><strong>Caves</strong><span>已启用</span></div></div></section>
        </section>
        <section class="tab-panel" data-panel="access" hidden><section class="section"><div class="section-head"><h2>访问与联机</h2><p>管理玩家访问规则</p></div><div class="form-grid"><label class="field"><span class="field-label">踢人投票比例</span><input type="number" value="50" min="0" max="100" /></label><label class="field"><span class="field-label">白名单预留位</span><input type="number" value="0" min="0" max="6" /></label><label class="field full"><span class="field-label">管理员 Klei ID</span><textarea rows="4" placeholder="每行一个 Klei ID"></textarea></label><label class="field full"><span class="field-label">白名单 Klei ID</span><textarea rows="4" placeholder="每行一个 Klei ID"></textarea></label><label class="field full"><span class="field-label">封禁名单 Klei ID</span><textarea rows="4" placeholder="每行一个 Klei ID"></textarea></label></div></section></section>
        <section class="tab-panel" data-panel="generation" hidden><section class="section"><div class="section-head"><h2>世界生成</h2><p>Master · 12 项</p></div><div class="form-grid"><label class="field"><span class="field-label">世界大小</span><select><option>中</option><option>小</option><option>大</option><option>巨大</option></select></label><label class="field"><span class="field-label">起始季节</span><select><option>秋</option><option>冬</option><option>春</option><option>夏</option></select></label><label class="field"><span class="field-label">资源丰富度</span><select><option>默认</option><option>较多</option><option>较少</option></select></label><label class="field"><span class="field-label">生物数量</span><select><option>默认</option><option>较多</option><option>较少</option></select></label></div></section></section>
        <section class="tab-panel" data-panel="rules" hidden><section class="section"><div class="section-head"><h2>世界规则</h2><p>Master · 18 项</p></div><div class="form-grid"><label class="field"><span class="field-label">白天长度</span><select><option>默认</option><option>较长</option><option>较短</option></select></label><label class="field"><span class="field-label">夜晚长度</span><select><option>默认</option><option>较长</option><option>较短</option></select></label><label class="field"><span class="field-label">季节长度</span><select><option>默认</option><option>较长</option><option>较短</option></select></label><label class="field"><span class="field-label">世界重置</span><select><option>关闭</option><option>开启</option></select></label></div></section></section>
      </div></div>
      <footer class="actionbar"><span class="action-message" id="actionMessage">有未保存的更改</span><button class="button" id="previewBtn" type="button">◉&nbsp; 预览应用</button><button class="button primary" id="saveBtn" type="button">保存期望配置</button></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const root=document.documentElement;
    const toast=document.getElementById('toast');
    const showToast=(message)=>{toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};
    document.getElementById('themeToggle').addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';});
    document.querySelectorAll('[data-tab]').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(item=>item.classList.toggle('active',item===tab));document.querySelectorAll('[data-panel]').forEach(panel=>panel.hidden=panel.dataset.panel!==tab.dataset.tab);}));
    document.getElementById('refreshBtn').addEventListener('click',()=>showToast('已重新读取世界配置'));
    document.getElementById('previewBtn').addEventListener('click',()=>showToast('已生成应用预览'));
    document.getElementById('saveBtn').addEventListener('click',()=>{document.getElementById('actionMessage').textContent='配置已保存，待应用';showToast('世界配置已保存');});
  </script>
</body>
</html>
