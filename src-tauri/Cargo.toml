[package]
name = "hunger-desolate"
version = "1.0.1"
description = "Desktop console for isolated DST instances"
edition = "2021"

[lib]
name = "hunger_desolate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "1.23.4", features = ["v4"] }
ssh2 = { version = "=0.9.6", features = ["vendored-openssl"] }
sha2 = "0.10.9"
base64 = "0.22.1"
zeroize = { version = "1.9.0", features = ["serde"] }
tauri-plugin-dialog = "=2.7.3"
mlua = { version = "0.10.4", features = ["lua51", "vendored"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "form", "rustls-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
